name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      # Repository variable: Settings > Secrets and variables > Actions > Variables.
      # Example: https://loghub-api.onrender.com
      API_URL: ${{ vars.LOGHUB_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      - name: Point the console at the API
        run: |
          test -n "$API_URL" || { echo "::error::Set the LOGHUB_API_URL repository variable"; exit 1; }
          printf "window.LOGHUB_API_URL = '%s';\n" "$API_URL" > dist/frontend/browser/config.js
      - name: SPA fallback for deep links
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
