# LogHub — centralized log management platform.
# Start:  ./scripts/init-env.sh && docker compose up -d --build
# See README.md for profiles, resource requirements and production guidance.
name: loghub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Platform containers ship their own stdout to Fluent Bit through Docker's fluentd
# driver. "async" keeps containers starting even when Fluent Bit is down, and
# `docker logs` still works thanks to Docker's dual logging cache.
# The ingestion stack itself (fluent-bit, logstash, elasticsearch) keeps json-file
# logging so its own logs can never feed back into the pipeline.
x-shipped-logging: &shipped-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"
    tag: "docker.{{.Name}}"
    labels: "com.docker.compose.service,com.docker.compose.project"

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?run scripts/init-env.sh}
  DEBUG: ${DEBUG:-false}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django-api}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:4200}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4200}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?}
  DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-default}
  POSTGRES_DB: ${POSTGRES_DB:-loghub}
  POSTGRES_USER: ${POSTGRES_USER:-loghub}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_USERNAME: loghub_api
  ELASTICSEARCH_PASSWORD: ${LOGHUB_ES_PASSWORD:?}
  LOGSTASH_HTTP_URL: http://logstash:8080
  LOGSTASH_MONITORING_URL: http://logstash:9600
  LOGSTASH_HTTP_USER: ${LOGSTASH_HTTP_USER:-shipper}
  LOGSTASH_HTTP_PASSWORD: ${LOGSTASH_HTTP_PASSWORD:?}
  FLUENT_BIT_URL: http://fluent-bit:2020
  KIBANA_URL: http://kibana:5601
  KIBANA_PUBLIC_URL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
  GRAFANA_URL: http://grafana:3000
  GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
  GRAFANA_USERNAME: loghub_viewer
  GRAFANA_PASSWORD: ${GRAFANA_VIEWER_PASSWORD:?}
  GRAYLOG_URL: http://graylog:9000
  GRAYLOG_PUBLIC_URL: ${GRAYLOG_PUBLIC_URL:-http://localhost:9000}
  GRAYLOG_USERNAME: loghub_reader
  GRAYLOG_PASSWORD: ${GRAYLOG_READER_PASSWORD:?}
  PROMETHEUS_URL: http://prometheus:9090
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-loghub-alerts@example.com}
  JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
  JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-1}

services:
  # ---------------------------------------------------------------- platform
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loghub}
      POSTGRES_USER: ${POSTGRES_USER:-loghub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    networks: [loghub-net]

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *default-logging
    networks: [loghub-net]

  django-api:
    build: ./backend
    image: loghub/django-api:local
    restart: unless-stopped
    command: ["sh", "/app/docker-entrypoint.sh", "web"]
    environment: *django-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    mem_limit: 768m
    logging: *shipped-logging
    networks: [loghub-net]

  celery-worker:
    image: loghub/django-api:local
    restart: unless-stopped
    command: ["sh", "/app/docker-entrypoint.sh", "worker"]
    environment:
      <<: *django-env
      SERVICE_NAME: celery-worker
    depends_on:
      django-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    mem_limit: 768m
    logging: *shipped-logging
    networks: [loghub-net]

  celery-beat:
    image: loghub/django-api:local
    restart: unless-stopped
    command: ["sh", "/app/docker-entrypoint.sh", "beat"]
    environment:
      <<: *django-env
      SERVICE_NAME: celery-beat
    depends_on:
      django-api: { condition: service_healthy }
    mem_limit: 256m
    logging: *shipped-logging
    networks: [loghub-net]

  frontend:
    build: ./frontend
    image: loghub/frontend:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4200:8080"
    depends_on:
      django-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *shipped-logging
    networks: [loghub-net]

  mailpit:
    image: axllent/mailpit:v1.20.5
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *default-logging
    networks: [loghub-net]

  # ---------------------------------------------------------------- elastic stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: loghub
      node.name: loghub-es-1
      bootstrap.memory_lock: "false"
      xpack.security.enabled: "true"
      # TLS is terminated at the network boundary in development; see README
      # "Production" for enabling xpack.security.http.ssl with real certificates.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      path.repo: /usr/share/elasticsearch/snapshots
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms768m -Xmx768m}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_snapshots:/usr/share/elasticsearch/snapshots
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20
    mem_limit: 2g
    logging: *default-logging
    networks: [loghub-net]

  # One-shot bootstrap: service users/roles, index template, ILM, Kibana data view,
  # Grafana viewer. Idempotent; reruns on every `up` and exits.
  setup:
    image: python:3.12.7-slim
    restart: "no"
    command: ["python", "-u", "/setup/bootstrap.py", "elastic"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD:?}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?}
      LOGHUB_ES_PASSWORD: ${LOGHUB_ES_PASSWORD:?}
    volumes:
      - ./observability/setup:/setup:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    logging: *default-logging
    networks: [loghub-net]

  # Kibana data view + Grafana API viewer. Nothing waits on this, so slow UIs never
  # delay ingestion.
  ui-setup:
    image: python:3.12.7-slim
    restart: "no"
    command: ["python", "-u", "/setup/bootstrap.py", "kibana", "grafana"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GRAFANA_VIEWER_PASSWORD: ${GRAFANA_VIEWER_PASSWORD:?}
    volumes:
      - ./observability/setup:/setup:ro
    depends_on:
      kibana: { condition: service_healthy }
      grafana: { condition: service_healthy }
    logging: *default-logging
    networks: [loghub-net]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms384m -Xmx384m}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD:?}
      LOGSTASH_HTTP_USER: ${LOGSTASH_HTTP_USER:-shipper}
      LOGSTASH_HTTP_PASSWORD: ${LOGSTASH_HTTP_PASSWORD:?}
      COLLECTOR_DEFAULT_ORG: ${COLLECTOR_DEFAULT_ORG:-default}
    ports:
      # Beats protocol for Filebeat/Winlogbeat shippers.
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:5044:5044"
    volumes:
      - ./observability/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./observability/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines/main >/dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20
    mem_limit: 1g
    logging: *default-logging
    networks: [loghub-net]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    restart: unless-stopped
    environment:
      SERVER_NAME: kibana
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      # 401 means Kibana is up and enforcing auth; 503 means still starting.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '^(200|401)$'"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 20
    mem_limit: 1g
    logging: *default-logging
    networks: [loghub-net]

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    restart: unless-stopped
    environment:
      LOGSTASH_HTTP_USER: ${LOGSTASH_HTTP_USER:-shipper}
      LOGSTASH_HTTP_PASSWORD: ${LOGSTASH_HTTP_PASSWORD:?}
      COLLECTOR_DEFAULT_ORG: ${COLLECTOR_DEFAULT_ORG:-default}
    ports:
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:24224:24224"
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:9880:9880"
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:5140:5140/udp"
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:5140:5140/tcp"
    volumes:
      - ./observability/fluent-bit:/fluent-bit/etc:ro
      - fluentbit_buffer:/var/fluent-bit
    depends_on:
      logstash: { condition: service_healthy }
    # The image is distroless (no shell), so health is probed by django-api via :2020.
    mem_limit: 256m
    logging: *default-logging
    networks: [loghub-net]

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    logging: *default-logging
    networks: [loghub-net]

  # ---------------------------------------------------------------- metrics (profile)
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [metrics]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    networks: [loghub-net]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [metrics]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *default-logging
    networks: [loghub-net]

  # ---------------------------------------------------------------- graylog (profile)
  # Graylog 6.1 supports OpenSearch 1.1–2.15 and MongoDB 5.0.7–7.x; it cannot use
  # the ELK Elasticsearch 8 cluster, so it gets its own storage on an internal network.
  mongodb:
    image: mongo:7.0.14
    profiles: [graylog]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-graylog}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    networks: [graylog-backend]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    profiles: [graylog]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: graylog
      bootstrap.memory_lock: "false"
      action.auto_create_index: "false"
      # Graylog's reference deployment runs OpenSearch without the security plugin.
      # It is reachable only from the internal graylog-backend network (no published
      # ports, no route to other services). See README "Security" for enabling it.
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20
    mem_limit: 1280m
    logging: *default-logging
    networks: [graylog-backend]

  graylog:
    image: graylog/graylog:6.1.4
    profiles: [graylog]
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_EXTERNAL_URL:-http://localhost:9000}/
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://${MONGO_USER:-graylog}:${MONGO_PASSWORD:?}@mongodb:27017/graylog?authSource=admin
      GRAYLOG_SERVER_JAVA_OPTS: ${GRAYLOG_JAVA_OPTS:--Xms512m -Xmx512m}
      GRAYLOG_TELEMETRY_ENABLED: "false"
      GRAYLOG_VERSIONCHECKS: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:12201:12201/udp"
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:12201:12201/tcp"
    volumes:
      - graylog_data:/usr/share/graylog/data
    depends_on:
      mongodb: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/lbstatus | grep -q ALIVE"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 20
    mem_limit: 1280m
    logging: *default-logging
    networks: [loghub-net, graylog-backend]

  graylog-setup:
    image: python:3.12.7-slim
    profiles: [graylog]
    restart: "no"
    command: ["python", "-u", "/setup/bootstrap.py", "graylog"]
    environment:
      GRAYLOG_ROOT_PASSWORD: ${GRAYLOG_ROOT_PASSWORD:?}
      GRAYLOG_READER_PASSWORD: ${GRAYLOG_READER_PASSWORD:?}
    volumes:
      - ./observability/setup:/setup:ro
    depends_on:
      graylog: { condition: service_healthy }
    logging: *default-logging
    networks: [loghub-net]

  # ---------------------------------------------------------------- demo (profile)
  demo-generator:
    image: loghub/django-api:local
    profiles: [demo]
    restart: unless-stopped
    command: ["python", "/app/demo/generate_logs.py", "--rate", "5"]
    environment:
      FLUENT_BIT_HTTP_URL: http://fluent-bit:9880
    depends_on:
      fluent-bit: { condition: service_started }
    mem_limit: 128m
    logging: *default-logging
    networks: [loghub-net]

volumes:
  postgres_data:
  elasticsearch_snapshots:
  redis_data:
  elasticsearch_data:
  logstash_data:
  kibana_data:
  fluentbit_buffer:
  grafana_data:
  prometheus_data:
  mongo_data:
  opensearch_data:
  graylog_data:

networks:
  loghub-net:
    driver: bridge
  graylog-backend:
    driver: bridge
    internal: true
