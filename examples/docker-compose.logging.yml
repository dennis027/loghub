# Ship any container's stdout/stderr to LogHub with Docker's fluentd logging driver.
# `docker logs` keeps working (dual logging); fluentd-async keeps the app up if the collector is down.
services:
  my-app:
    image: my/app:1.0
    labels:
      com.docker.compose.service: my-app          # becomes the "service" field
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"        # the LogHub Fluent Bit forward input
        fluentd-async: "true"
        fluentd-sub-second-precision: "true"
        tag: "docker.{{.Name}}"
        labels: "com.docker.compose.service"
