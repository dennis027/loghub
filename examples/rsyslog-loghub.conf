# /etc/rsyslog.d/60-loghub.conf — forward all syslog to LogHub (port 5140).
# @@ = TCP (reliable, recommended), @ = UDP. Disk-assisted queue survives collector outages.
action(type="omfwd" target="<collector-host>" port="5140" protocol="tcp"
       queue.type="LinkedList" queue.filename="loghub_fwd" queue.maxDiskSpace="256m"
       queue.saveOnShutdown="on" action.resumeRetryCount="-1")
