# Fluent Bit agent on a Linux host, forwarding to the LogHub collector.
# Install Fluent Bit 3.x, replace <collector-host>, then: fluent-bit -c fluent-bit-agent.conf
[SERVICE]
    Flush         5
    Log_Level     info
    storage.path  /var/lib/fluent-bit/storage

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log,/var/log/nginx/error.log
    Tag               host.nginx
    DB                /var/lib/fluent-bit/nginx.db
    Mem_Buf_Limit     16MB
    storage.type      filesystem

[INPUT]
    Name              systemd
    Tag               host.journal
    Read_From_Tail    On

[FILTER]
    Name    modify
    Match   host.*
    Set     environment production
    Set     hostname ${HOSTNAME}
    # Route: elk (default) | graylog | both
    Set     log_route elk

[FILTER]
    Name    modify
    Match   host.nginx
    Set     service nginx-edge

[OUTPUT]
    Name         forward
    Match        *
    Host         <collector-host>
    Port         24224
    Retry_Limit  10
