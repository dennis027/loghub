# Development overrides, applied automatically by `docker compose up`.
# For production-like runs use: docker compose -f docker-compose.yml up -d
services:
  django-api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      DEBUG: "true"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  celery-worker:
    volumes:
      - ./backend:/app

  celery-beat:
    volumes:
      - ./backend:/app

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
