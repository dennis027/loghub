apiVersion: 1

datasources:
  - name: LogHub Logs
    uid: loghub-es
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: grafana_reader
    secureJsonData:
      basicAuthPassword: $GRAFANA_READER_PASSWORD
    jsonData:
      index: logs-loghub-*
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
    isDefault: true
    editable: false

  - name: Prometheus
    uid: loghub-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
