# LogHub collector.
#
# Inputs                       Tag              Organization
#   forward  :24224 (Docker)   docker.<name>    forced to COLLECTOR_DEFAULT_ORG
#   http     :9880  (apps)     http.collector   forced to COLLECTOR_DEFAULT_ORG
#   syslog   :5140  udp/tcp    syslog.*         forced to COLLECTOR_DEFAULT_ORG
#   http     :9881  (internal) ingest.api       stamped by Django from the source token
#
# Routing: each record carries log_route = elk (default) | graylog | both.
#   elk     -> Logstash -> Elasticsearch
#   graylog -> Graylog GELF input only
#   both    -> copied to both (explicit opt-in; doubles storage)

[SERVICE]
    Flush                     2
    Grace                     10
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60
    storage.path              /var/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 32M
    storage.metrics           on

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M
    storage.type      filesystem

[INPUT]
    Name          http
    Listen        0.0.0.0
    Port          9880
    Tag           http.collector
    Buffer_Max_Size 4M
    storage.type  filesystem

# Not published on the host; only reachable from containers on loghub-net.
[INPUT]
    Name          http
    Listen        0.0.0.0
    Port          9881
    Tag           ingest.api
    Buffer_Max_Size 8M
    storage.type  filesystem

[INPUT]
    Name          syslog
    Mode          udp
    Listen        0.0.0.0
    Port          5140
    Parser        syslog-auto
    Tag           syslog.udp
    storage.type  filesystem

[INPUT]
    Name          syslog
    Mode          tcp
    Listen        0.0.0.0
    Port          5140
    Parser        syslog-auto
    Tag           syslog.tcp
    storage.type  filesystem

# Drop container healthcheck access logs (one every 15s per service) before they cost storage.
[FILTER]
    Name    grep
    Match   docker.*
    Exclude log /(health/live|health/ready|healthz)[ "?]

[FILTER]
    Name    lua
    Match   *
    script  normalize.lua
    call    normalize

[FILTER]
    Name                  rewrite_tag
    Match_Regex           ^(?!graylog\.).*
    Rule                  $log_route ^graylog$ graylog.$TAG false
    Rule                  $log_route ^both$    graylog.$TAG true
    Emitter_Name          route_graylog
    Emitter_Storage.type  filesystem
    Emitter_Mem_Buf_Limit 16M

[OUTPUT]
    Name                     http
    Alias                    to_logstash
    Match_Regex              ^(?!graylog\.).*
    Host                     logstash
    Port                     8080
    URI                      /
    Format                   json
    json_date_key            fb_time
    json_date_format         iso8601
    http_User                ${LOGSTASH_HTTP_USER}
    http_Passwd              ${LOGSTASH_HTTP_PASSWORD}
    Retry_Limit              10
    storage.total_limit_size 1G

[OUTPUT]
    Name                     gelf
    Alias                    to_graylog
    Match                    graylog.*
    Host                     graylog
    Port                     12201
    Mode                     tcp
    Gelf_Short_Message_Key   message
    Gelf_Host_Key            hostname
    Gelf_Level_Key           gelf_level
    Retry_Limit              5
    storage.total_limit_size 256M
