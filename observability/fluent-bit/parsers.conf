[PARSER]
    Name        syslog-rfc5424
    Format      regex
    Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   Off

[PARSER]
    Name        syslog-rfc3164
    Format      regex
    Regex       /^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   Off

# Accepts both RFC 5424 and RFC 3164 (BSD) framing, falling back to the raw line.
[PARSER]
    Name        syslog-auto
    Format      regex
    Regex       ^\<(?<pri>[0-9]{1,5})\>(?:1 (?<time5424>[^ ]+) |(?<time3164>[A-Z][a-z]{2} {1,2}\d{1,2} \d{2}:\d{2}:\d{2}) )?(?<host>[^ ]+) (?<ident>[^ :\[]+)(?:\[(?<pid>[0-9]+)\])?(?: [-0-9]+ [^ ]+ (?:\[.*?\]|-))?:? *(?<message>.*)$
