# LogHub main pipeline: parse, normalize, mask, fingerprint, index.
# Delivery is at-least-once; the fingerprint document id makes retried events
# idempotent within a backing index (create on an existing _id is a no-op 409).

input {
  # Fluent Bit (and the Django ingest API, via Fluent Bit) post JSON arrays here.
  http {
    id => "in_http"
    port => 8080
    user => "${LOGSTASH_HTTP_USER}"
    password => "${LOGSTASH_HTTP_PASSWORD}"
    codec => json
    additional_codecs => { "application/json" => "json" }
    add_field => { "[@metadata][input]" => "http" }
  }
  # Filebeat / other Beats shippers.
  beats {
    id => "in_beats"
    port => 5044
    add_field => { "[@metadata][input]" => "beats" }
  }
}

filter {
  # ---- transport metadata ------------------------------------------------
  if [@metadata][input] == "http" {
    mutate { remove_field => ["headers", "host"] }
  } else if [@metadata][input] == "beats" {
    mutate {
      copy => { "[host][name]" => "hostname" "[log][file][path]" => "log_file" }
      remove_field => ["host", "agent", "ecs", "input", "log"]
      add_field => { "collector" => "beats" "organization" => "${COLLECTOR_DEFAULT_ORG}" }
    }
  }

  # ---- structured payloads: JSON log lines ------------------------------
  if [message] =~ /^\s*\{.*\}\s*$/ {
    json {
      id => "parse_json_message"
      source => "message"
      target => "[@metadata][json]"
      skip_on_invalid_json => true
    }
    if [@metadata][json] {
      ruby {
        id => "merge_json"
        code => '
          parsed = event.get("[@metadata][json]")
          renames = { "msg" => "message", "levelname" => "level", "severity" => "level",
                      "name" => "logger", "logger_name" => "logger", "time" => "timestamp", "@timestamp" => "timestamp",
                      "asctime" => "timestamp", "host" => "hostname", "exc_info" => "[error][stack_trace]" }
          # Tenant and routing fields are set by the trusted ingestion path, never by payloads.
          protected = %w[organization collector source_id source_type log_route]
          event.set("raw", event.get("message"))
          parsed.each do |k, v|
            target = renames.fetch(k, k)
            next if protected.include?(target) || target.start_with?("@")
            target = "[#{target}]" unless target.start_with?("[")
            event.set(target, v)
          end
        '
      }
    }
  }

  # ---- web server access logs (nginx / apache combined format) ------------
  if [message] =~ /^\S+ \S+ \S+ \[[^\]]+\] "/ {
    grok {
      id => "grok_access_log"
      match => { "message" => '^%{IPORHOST:client_ip} %{NOTSPACE} %{NOTSPACE:[@metadata][user]} \[%{HTTPDATE:[@metadata][access_ts]}\] "%{WORD:[http][method]} %{NOTSPACE:[http][path]}(?: HTTP/%{NUMBER})?" %{INT:[http][status]:int} (?:%{INT:[http][bytes]:int}|-)(?: "%{DATA:[@metadata][referrer]}" "%{DATA:[http][user_agent]}")?' }
      tag_on_failure => []
      add_field => { "event_type" => "http_access" }
    }
    if [event_type] == "http_access" {
      date { match => ["[@metadata][access_ts]", "dd/MMM/yyyy:HH:mm:ss Z"] target => "@timestamp" }
      if [@metadata][user] != "-" { mutate { copy => { "[@metadata][user]" => "user" } } }
      if [http][status] >= 500 { mutate { replace => { "level" => "error" } } }
      else if [http][status] >= 400 { mutate { replace => { "level" => "warning" } } }
      else { mutate { replace => { "level" => "info" } } }
    }
  }

  # ---- timestamps --------------------------------------------------------
  if [timestamp] {
    date {
      id => "parse_timestamp"
      match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["timestamp"]
      tag_on_failure => ["_timestamp_unparsed"]
    }
  } else if [fb_time] and ![@metadata][access_ts] {
    date { match => ["fb_time", "ISO8601"] target => "@timestamp" }
  }
  mutate { remove_field => ["fb_time", "gelf_level"] }

  # ---- normalization, tenant safety, masking -------------------------------
  ruby {
    id => "normalize"
    code => '
      levels = { "trace"=>"debug", "debug"=>"debug", "info"=>"info", "information"=>"info",
                 "notice"=>"info", "warn"=>"warning", "warning"=>"warning", "err"=>"error",
                 "error"=>"error", "crit"=>"critical", "critical"=>"critical", "fatal"=>"critical",
                 "alert"=>"critical", "emerg"=>"critical", "panic"=>"critical" }
      lvl = event.get("level").to_s.downcase
      if levels.key?(lvl)
        event.set("level", levels[lvl])
      elsif event.get("message").to_s =~ /\b(Traceback|Exception|ERROR)\b/
        event.set("level", "error")
      else
        event.set("level", "info")
      end

      # Index names are derived from the organization; restrict to a safe charset.
      org = event.get("organization").to_s.downcase.gsub(/[^a-z0-9_]/, "_")
      org = "default" if org.empty?
      event.set("organization", org)
      event.set("[@metadata][index]", "logs-loghub-" + org)

      # "error" is mapped as an object; coerce scalar values so they never hit the DLQ.
      err = event.get("error")
      event.set("error", { "message" => err.to_s }) if !err.nil? && !err.is_a?(Hash)
      event.set("http", { "detail" => event.get("http").to_s }) if !event.get("http").nil? && !event.get("http").is_a?(Hash)
      event.set("service", event.get("container") || "unknown") if event.get("service").to_s.empty?
      event.set("environment", "unknown") if event.get("environment").to_s.empty?
      event.set("ingested_at", Time.now.utc.iso8601(3))

      sensitive = /pass(word|wd)?|secret|token|api[_-]?key|authorization|cookie|credential|private[_-]?key|access[_-]?key/i
      safe = %w[fingerprint trace_id span_id log_route]
      walker = lambda do |obj, depth|
        return obj if depth > 5
        case obj
        when Hash
          obj.each { |k, v| obj[k] = (k =~ sensitive && !safe.include?(k) && !v.is_a?(Hash)) ? "[REDACTED]" : walker.call(v, depth + 1) }
        when Array then obj.map { |v| walker.call(v, depth + 1) }
        when String
          obj.gsub(/(bearer\s+)[\w\-.~+\/]+=*/i, "\\1[REDACTED]")
             .gsub(/((?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|authorization)["\x27]?\s*[:=]\s*["\x27]?)[^\s"\x27&,;}]+/i, "\\1[REDACTED]")
        else obj
        end
      end
      event.to_hash.each do |k, v|
        next if k.start_with?("@")
        event.set(k, (k =~ sensitive && !safe.include?(k) && !v.is_a?(Hash)) ? "[REDACTED]" : walker.call(v, 0))
      end
    '
  }

  fingerprint {
    id => "fingerprint"
    source => ["@timestamp", "message", "service", "hostname", "container", "source_id", "event_id"]
    concatenate_sources => true
    method => "SHA256"
    target => "fingerprint"
  }
}

output {
  elasticsearch {
    id => "out_elasticsearch"
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "%{[@metadata][index]}"
    action => "create"
    document_id => "%{fingerprint}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
    retry_max_interval => 30
  }
}
