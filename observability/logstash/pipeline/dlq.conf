# Dead-letter replay. Events Elasticsearch rejected in the main pipeline (usually
# a field type conflict) are coerced into the template's shape and re-indexed.
# Consumed DLQ segments are deleted. This pipeline has no DLQ of its own, so an
# event that still fails is logged and dropped instead of looping.

input {
  dead_letter_queue {
    id => "in_dlq"
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "main"
    commit_offsets => true
    clean_consumed => true
  }
}

filter {
  ruby {
    id => "coerce_for_replay"
    code => '
      # Object-mapped fields that a producer sent as scalars.
      { "error" => "message", "http" => "detail" }.each do |f, key|
        v = event.get(f)
        event.set(f, { key => v.to_s }) if !v.nil? && !v.is_a?(Hash)
      end
      reason = event.get("[@metadata][dead_letter_queue][reason]").to_s
      event.set("dlq_reason", reason[0, 500]) unless reason.empty?
      event.set("tags", (Array(event.get("tags")) + ["dlq_replayed"]).uniq)
      org = event.get("organization").to_s.downcase.gsub(/[^a-z0-9_]/, "_")
      org = "default" if org.empty?
      event.set("[@metadata][index]", "logs-loghub-" + org)
    '
  }
}

output {
  elasticsearch {
    id => "out_dlq_replay"
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "%{[@metadata][index]}"
    action => "create"
    document_id => "%{fingerprint}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
