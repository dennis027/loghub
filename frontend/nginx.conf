# Serves the Angular build and proxies the API. Runs unprivileged on :8080.
# For TLS, terminate HTTPS in front of this container (see deploy/nginx/tls.conf.example).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

log_format json_access escape=json
  '{"timestamp":"$time_iso8601","message":"$request_method $uri $status","level":"info",'
  '"event_type":"http_access","service":"frontend","client_ip":"$remote_addr",'
  '"http":{"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"user_agent":"$http_user_agent"},"request_id":"$request_id","request_time_s":$request_time}';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  access_log /dev/stdout json_access;

  # Static assets get a strict CSP: no inline scripts, API is same-origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location /api/ {
    proxy_pass http://django-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
  }

  # Server-Sent Events: no buffering, long read timeout.
  location /api/logs/live/ {
    proxy_pass http://django-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 400s;
  }
}
